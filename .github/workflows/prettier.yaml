name: Prettier YAML Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run Prettier for YAML files
        uses: creyD/prettier_action@v4.6
        with:
          no_commit: true
          prettier_options: "--check '**/*.{yaml,yml}'"
